# Web Opentify (client/build/web) -- jen pro tenhle počítač (127.0.0.1) a
# Tailscale kontejner; dřív dhttpd na 0.0.0.0:5000 viditelný v domácí
# i pracovní síti (bezpečnostní audit).
server {
  listen 80;
  root /usr/share/nginx/html;
  # Standardní typy (html, js, wasm...). Vlastní `types {}` blok by je celé
  # NAHRADIL -- index.html pak chodil jako application/octet-stream a
  # prohlížeč ho při obnovení stránky stáhl jako soubor (živě nahlášeno).
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Komprese: main.dart.js (4,4 MB) a canvaskit.wasm (5,4 MB) šly bez ní,
  # na mobilních datech se appka načítala desítky sekund (UX audit 7. 10.).
  # gzip_static vezme předkomprimované .gz vedle souboru (deploy je dělá),
  # jinak gzip za běhu.
  gzip on;
  gzip_static on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json application/wasm
             image/svg+xml text/plain application/manifest+json font/ttf font/otf;

  location / {
    try_files $uri $uri/ /index.html;
  }
  # .mjs ve výchozím seznamu není.
  location ~* \.mjs$ {
    default_type application/javascript;
  }
  # Nový build hned: index a bootstrap nekešovat.
  location ~* (index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json)$ {
    add_header Cache-Control "no-cache";
  }
}
