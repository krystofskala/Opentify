# Web Opentify (client/build/web) -- jen pro tenhle počítač (127.0.0.1) a
# Tailscale kontejner; dřív dhttpd na 0.0.0.0:5000 viditelný v domácí
# i pracovní síti (bezpečnostní audit).
server {
  listen 80;
  root /usr/share/nginx/html;
  # Standardní typy (html, js, wasm...). Vlastní `types {}` blok by je celé
  # NAHRADIL -- index.html pak chodil jako application/octet-stream a
  # prohlížeč ho při obnovení stránky stáhl jako soubor (živě nahlášeno).
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  location / {
    try_files $uri $uri/ /index.html;
  }
  # .mjs ve výchozím seznamu není.
  location ~* \.mjs$ {
    default_type application/javascript;
  }
  # Nový build hned: index a bootstrap nekešovat.
  location ~* (index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json)$ {
    add_header Cache-Control "no-cache";
  }
}
