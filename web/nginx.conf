# Web Opentify (client/build/web) -- jen pro tenhle počítač (127.0.0.1) a
# Tailscale kontejner; dřív dhttpd na 0.0.0.0:5000 viditelný v domácí
# i pracovní síti (bezpečnostní audit).
# Neexistující cesty z internetu (Funnel) = boti zkoušející /wp-login.php,
# /.env... Zapisují se do sdíleného logu, API z nich jednou za čas pošle
# souhrn (backend/app/probe_watch.py). Odpověď se nemění. Appka cesty
# nepoužívá (hash routing), běžné dotazy prohlížečů (favicon...) se nepočítají.
map $http_tailscale_funnel_request $from_funnel {
  ""      0;
  default 1;
}
map $uri $browser_noise {
  ~^/(favicon\.ico|robots\.txt|apple-touch-icon[^/]*|\.well-known/.*)$ 1;
  default 0;
}
map "$from_funnel$browser_noise" $log_probe {
  "10"    1;
  default 0;
}
# Oddělovač = tabulátor.
log_format probe '$time_iso8601	$http_x_forwarded_for	$request_method	$request_uri	$http_user_agent';

server {
  listen 80;
  root /usr/share/nginx/html;
  # Standardní typy (html, js, wasm...). Vlastní `types {}` blok by je celé
  # NAHRADIL -- index.html pak chodil jako application/octet-stream a
  # prohlížeč ho při obnovení stránky stáhl jako soubor (živě nahlášeno).
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Komprese: main.dart.js (4,4 MB) a canvaskit.wasm (5,4 MB) šly bez ní,
  # na mobilních datech se appka načítala desítky sekund (UX audit 7. 10.).
  # gzip_static vezme předkomprimované .gz vedle souboru (deploy je dělá),
  # jinak gzip za běhu.
  gzip on;
  gzip_static on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json application/wasm
             image/svg+xml text/plain application/manifest+json font/ttf font/otf;

  location / {
    try_files $uri $uri/ @app;
  }
  location @app {
    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/probe/funnel-unknown.log probe if=$log_probe;
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }
  # .mjs ve výchozím seznamu není.
  location ~* \.mjs$ {
    default_type application/javascript;
  }
  # Nový build hned: index a bootstrap nekešovat.
  location ~* (index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json)$ {
    add_header Cache-Control "no-cache";
  }
}
