name: opentify_client
description: >
  Opentify — multiplatformní Flutter klient (iOS/Android/Windows/Linux/Web)
  pro osobní hudební backend (docs/openapi.yaml, docs/asyncapi.yaml).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  audio_session: ^0.1.25
  cached_network_image: ^3.4.0
  file_picker: ^8.0.7
  flutter:
    sdk: flutter

  # Stavová vrstva — StateNotifier/Provider grafy nad HTTP i WS daty.
  flutter_riverpod: ^2.5.1

  # Navigace: StatefulShellRoute pro bottom-nav (Domů/Hledat) + push routy
  # pro detail interpreta/alba, s deep-linkingem zadarmo i na webu.
  go_router: ^14.2.0

  # HTTP klient pro REST vrstvu (/catalog, /recommendations, /tracks, /jobs).
  http: ^1.2.2

  # WebSocket kanál pro /ws (viz docs/asyncapi.yaml) — funguje shodně na
  # IO i web platformě.
  just_audio: ^0.9.44
  palette_generator: ^0.3.3+7
  web_socket_channel: ^3.0.3

  # Perzistence per-zařízení (historie hledání) -- žádná z toho nepatří na
  # server, je to čistě UI pohodlí konkrétního prohlížeče/zařízení.
  shared_preferences: ^2.3.2
  web: ^1.1.0

  # Vizuální jazyk PixelPlayeru (github.com/brendmung/PixelPlayer) přenesený
  # do Flutteru přes reálné, udržované balíčky místo dalších ručně psaných
  # widgetů -- ikony (Material Symbols Rounded, přesně stejná rodina, co
  # PixelPlayer používá jako exportované `rounded_<name>_24` vektory),
  # "squircle" tvary (`AbsoluteSmoothCornerShape` ekvivalent) a lehké
  # staggered entrance animace.
  material_symbols_icons: ^4.2960.0
  figma_squircle: ^0.6.3
  flutter_animate: ^4.5.2
  url_launcher: ^6.3.2
  path_provider: ^2.1.6
  audio_service: ^0.18.19
  record: ^7.1.1
  share_plus: ^10.0.0
  just_audio_media_kit: ^2.0.6
  media_kit_libs_windows_audio: ^1.0.9
  package_info_plus: ^9.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Animované zrnité pozadí (lib/widgets/app_background.dart).
  shaders:
    - shaders/chroma_grain.frag
    - shaders/liquid_glass.frag

  # PixelPlay-inspired jednotný zaoblený typeface napříč appkou (viz
  # lib/theme/app_theme.dart) -- bundlovaný OFL soubor, ne `google_fonts`
  # balíček s běhovým fetchem, ať appka zůstane funkční čistě self-hosted
  # bez závislosti na Google serverech. Jeden variabilní soubor pokrývá
  # celou váhovou škálu (400-800), Flutter si z něj sám vybere instanci
  # podle FontWeight v TextStyle.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito/Nunito-VariableFont_wght.ttf
          weight: 400
        - asset: assets/fonts/Nunito/Nunito-VariableFont_wght.ttf
          weight: 500
        - asset: assets/fonts/Nunito/Nunito-VariableFont_wght.ttf
          weight: 600
        - asset: assets/fonts/Nunito/Nunito-VariableFont_wght.ttf
          weight: 700
        - asset: assets/fonts/Nunito/Nunito-VariableFont_wght.ttf
          weight: 800
