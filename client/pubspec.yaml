name: opentify_client
description: >
  Opentify — multiplatformní Flutter klient (iOS/Android/Windows/Linux/Web)
  pro osobní hudební backend (docs/openapi.yaml, docs/asyncapi.yaml).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  audio_session: ^0.1.25
  cached_network_image: ^3.4.0
  file_picker: ^8.0.7
  flutter:
    sdk: flutter

  # Stavová vrstva — StateNotifier/Provider grafy nad HTTP i WS daty.
  flutter_riverpod: ^2.5.1

  # Navigace: StatefulShellRoute pro bottom-nav (Domů/Hledat) + push routy
  # pro detail interpreta/alba, s deep-linkingem zadarmo i na webu.
  go_router: ^14.2.0

  # HTTP klient pro REST vrstvu (/catalog, /recommendations, /tracks, /jobs).
  http: ^1.2.2

  # WebSocket kanál pro /ws (viz docs/asyncapi.yaml) — funguje shodně na
  # IO i web platformě.
  just_audio: ^0.9.44
  palette_generator: ^0.3.3+7
  web_socket_channel: ^2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
