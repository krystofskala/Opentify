# Android appka: APK (podepsaný debug klíčem -- jde rovnou nainstalovat,
# "Instalovat z neznámých zdrojů"). Spuštění tagem `android-*` / `app-*`
# nebo ručně v Actions.
name: Android build

on:
  workflow_dispatch:
  push:
    tags: ['android-*', 'app-*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Závislosti
        working-directory: client
        run: flutter pub get

      - name: Podpisový klíč
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/opentify-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/opentify-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Bez ANDROID_KEYSTORE_BASE64 -- podpis ladicím klíčem, update přes starou verzi nepůjde."
          fi

      - name: Build APK
        working-directory: client
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >
          flutter build apk --release
          --build-name=0.1.${{ github.run_number }}
          --build-number=${{ github.run_number }}
          --dart-define=API_BASE_URL=https://${{ vars.OPENTIFY_HOST || (github.repository == 'krystofskala/Opentify' && 'opentify.tail343940.ts.net' || '') }}/api/v1
          --dart-define=WS_BASE_URL=wss://${{ vars.OPENTIFY_HOST || (github.repository == 'krystofskala/Opentify' && 'opentify.tail343940.ts.net' || '') }}/ws
          --dart-define=SHARED_ORIGIN=https://${{ vars.OPENTIFY_HOST || (github.repository == 'krystofskala/Opentify' && 'opentify.tail343940.ts.net' || '') }}
          --dart-define=UPDATE_REPO=${{ github.repository }}

      - name: Přejmenovat
        working-directory: client
        run: cp build/app/outputs/flutter-apk/app-release.apk Opentify.apk && ls -lh Opentify.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Opentify-apk
          path: client/Opentify.apk
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: client/Opentify.apk
          prerelease: true

      # Stálé vydání "android-latest" -- appka z něj zjišťuje a stahuje
      # aktualizace (client/lib/core/app_update_io.dart).
      - name: Verze pro aktualizace
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: client
        run: |
          echo '{"build": ${{ github.run_number }}, "version": "0.1.${{ github.run_number }}", "apk": "https://github.com/${{ github.repository }}/releases/download/android-latest/Opentify.apk"}' > version.json

      - name: Release android-latest
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Opentify Android (nejnovější)
          files: |
            client/Opentify.apk
            client/version.json
          prerelease: true
          make_latest: false
