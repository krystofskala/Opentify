# Android appka: APK (podepsaný debug klíčem -- jde rovnou nainstalovat,
# "Instalovat z neznámých zdrojů"). Spuštění tagem `android-*` / `app-*`
# nebo ručně v Actions.
name: Android build

on:
  workflow_dispatch:
  push:
    tags: ['android-*', 'app-*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Závislosti
        working-directory: client
        run: flutter pub get

      - name: Build APK
        working-directory: client
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=https://desktop-2lissjt.tail343940.ts.net/api/v1
          --dart-define=WS_BASE_URL=wss://desktop-2lissjt.tail343940.ts.net/ws

      - name: Přejmenovat
        working-directory: client
        run: cp build/app/outputs/flutter-apk/app-release.apk Opentify.apk && ls -lh Opentify.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Opentify-apk
          path: client/Opentify.apk
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: client/Opentify.apk
          prerelease: true
