# Nativní appka pro iPhone bez Macu: macOS runner postaví NEPODEPSANÝ .ipa,
# podepíše ho až SideStore v telefonu (bezplatné Apple ID, 7 dní, obnova
# automaticky). Viz docs/IOS_NATIVE_PLAN.md.
#
# Spuštění: každý push do main se změnou appky (client/**), tag `ios-*`
# / `app-*`, nebo ručně. Výsledek: GitHub Release s Opentify.ipa a nový
# source.json ve větvi `altstore` -- SideStore ho sleduje a update nabídne sám.
name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['client/**', '.github/workflows/ios.yml']
    tags: ['ios-*', 'app-*']

concurrency:
  group: ios-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Závislosti
        working-directory: client
        run: flutter pub get

      - name: Rozšíření (Live Activity, Ovládací centrum)
        working-directory: client
        run: |
          sudo gem install xcodeproj --no-document
          ruby ios/tool/add_widget_extension.rb

      - name: Build (bez podpisu)
        working-directory: client
        run: >
          flutter build ios --release --no-codesign
          --build-name=0.1.${{ github.run_number }} --build-number=${{ github.run_number }}
          --dart-define=API_BASE_URL=https://desktop-2lissjt.tail343940.ts.net/api/v1
          --dart-define=WS_BASE_URL=wss://desktop-2lissjt.tail343940.ts.net/ws

      - name: Zabalit .ipa
        working-directory: client
        run: |
          APP=build/ios/iphoneos/Runner.app
          ls "$APP/PlugIns" || true
          # Ad-hoc podpis s oprávněními (App Group) -- SideStore z nich pozná,
          # jakou skupinu má appce a rozšíření při podpisu přidělit.
          if [ -d "$APP/PlugIns/OpentifyWidgets.appex" ]; then
            codesign --force --sign - --entitlements ios/OpentifyWidgets/OpentifyWidgets.entitlements "$APP/PlugIns/OpentifyWidgets.appex"
          fi
          codesign --force --sign - --entitlements ios/Runner/Runner.entitlements "$APP"
          codesign -d --entitlements :- "$APP" | head -20
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Opentify.ipa Payload
          ls -lh Opentify.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Opentify-ipa
          path: client/Opentify.ipa
          retention-days: 30

      - name: Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ios-build-{0}', github.run_number) }}
          files: client/Opentify.ipa
          prerelease: true
          body: |
            Nepodepsaná appka pro iPhone (verze 0.1.${{ github.run_number }}). Aktualizace chodí samy přes zdroj
            v SideStore: https://raw.githubusercontent.com/${{ github.repository }}/altstore/source.json

      - name: Zdroj pro SideStore (source.json)
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ios-build-{0}', github.run_number) }}"
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/Opentify.ipa"
          SIZE=$(stat -f%z client/Opentify.ipa)
          python3 .github/scripts/altstore_source.py "0.1.${{ github.run_number }}" "$URL" "$SIZE" /tmp/source.json
          git config user.name "opentify-ci"
          git config user.email "opentify-ci@users.noreply.github.com"
          git fetch origin altstore || true
          if git rev-parse --verify origin/altstore >/dev/null 2>&1; then
            git checkout -f -B altstore origin/altstore
          else
            git checkout --orphan altstore
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp /tmp/source.json source.json
          git add source.json
          git commit -m "Opentify 0.1.${{ github.run_number }}" || echo "beze změny"
          git push origin altstore
