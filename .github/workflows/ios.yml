# Nativní appka pro iPhone bez Macu: macOS runner postaví NEPODEPSANÝ .ipa,
# podepíše ho až SideStore v telefonu (bezplatné Apple ID, 7 dní, obnova
# automaticky). Viz docs/IOS_NATIVE_PLAN.md.
#
# Spuštění: jednou denně v noci (jen když se appka od poslední verze
# změnila -- ne update po každé drobnosti), tag `ios-*` / `app-*` pro
# okamžitou verzi, nebo ručně. Výsledek: GitHub Release s Opentify.ipa
# a nový source.json ve větvi `altstore` -- SideStore update nabídne sám.
name: iOS build

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'  # 3:30 SELČ
  push:
    tags: ['ios-*', 'app-*']

concurrency:
  group: ios-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Změnilo se něco od poslední verze?
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          LAST=$(curl -sf "https://raw.githubusercontent.com/${{ github.repository }}/altstore/source.json" | python3 -c "import sys,json; print(json.load(sys.stdin).get('opentifyCommit',''))" || true)
          if [ -n "$LAST" ] && git cat-file -e "$LAST" 2>/dev/null && [ -z "$(git diff --name-only "$LAST" HEAD -- client .github/workflows/ios.yml)" ]; then
            echo "Beze změn od $LAST -- noční build se přeskakuje."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.changes.outputs.build == 'true'
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Závislosti
        if: steps.changes.outputs.build == 'true'
        working-directory: client
        run: flutter pub get

      - name: Kontrola jednotného vzhledu
        if: steps.changes.outputs.build == 'true'
        working-directory: client
        run: flutter test test/design_consistency_test.dart

      - name: Rozšíření (Live Activity, Ovládací centrum)
        if: steps.changes.outputs.build == 'true'
        working-directory: client
        run: |
          sudo gem install xcodeproj --no-document
          ruby ios/tool/add_widget_extension.rb

      # Systémové sklo (UIGlassEffect) potřebuje SDK iOS 26 -- nejnovější
      # Xcode 26 na runneru, je-li; jinak se přeloží záložní rozmazání.
      - name: Xcode 26
        if: steps.changes.outputs.build == 'true'
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version

      # Adresa serveru je v nastavení repozitáře (Settings › Secrets and variables ›

      # Actions › Variables › OPENTIFY_HOST), ne v kódu.

      - name: Adresa serveru (OPENTIFY_HOST)

        run: test -n "${{ vars.OPENTIFY_HOST }}" || { echo '::error::Nastav proměnnou repozitáře OPENTIFY_HOST (adresa serveru)'; exit 1; }

        shell: bash

      - name: Build (bez podpisu)
        if: steps.changes.outputs.build == 'true'
        working-directory: client
        run: >
          flutter build ios --release --no-codesign
          --build-name=0.1.${{ github.run_number }} --build-number=${{ github.run_number }}
          --dart-define=API_BASE_URL=https://${{ vars.OPENTIFY_HOST }}/api/v1
          --dart-define=WS_BASE_URL=wss://${{ vars.OPENTIFY_HOST }}/ws
          --dart-define=SHARED_ORIGIN=https://${{ vars.OPENTIFY_HOST }}
          --dart-define=UPDATE_REPO=${{ github.repository }}

      - name: Zabalit .ipa
        if: steps.changes.outputs.build == 'true'
        working-directory: client
        run: |
          APP=build/ios/iphoneos/Runner.app
          ls "$APP/PlugIns" || true
          # Ad-hoc podpis s oprávněními (App Group) -- SideStore z nich pozná,
          # jakou skupinu má appce a rozšíření při podpisu přidělit.
          if [ -d "$APP/PlugIns/OpentifyWidgets.appex" ]; then
            codesign --force --sign - --entitlements ios/OpentifyWidgets/OpentifyWidgets.entitlements "$APP/PlugIns/OpentifyWidgets.appex"
          fi
          codesign --force --sign - --entitlements ios/Runner/Runner.entitlements "$APP"
          codesign -d --entitlements :- "$APP" | head -20
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Opentify.ipa Payload
          ls -lh Opentify.ipa

      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.build == 'true'
        with:
          name: Opentify-ipa
          path: client/Opentify.ipa
          retention-days: 30

      - name: Release
        if: steps.changes.outputs.build == 'true'
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ios-build-{0}', github.run_number) }}
          files: client/Opentify.ipa
          prerelease: true
          body: |
            Nepodepsaná appka pro iPhone (verze 0.1.${{ github.run_number }}). Aktualizace chodí samy přes zdroj
            v SideStore: https://raw.githubusercontent.com/${{ github.repository }}/altstore/source.json

      - name: Zdroj pro SideStore (source.json)
        if: steps.changes.outputs.build == 'true'
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ios-build-{0}', github.run_number) }}"
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/Opentify.ipa"
          SIZE=$(stat -f%z client/Opentify.ipa)
          python3 .github/scripts/altstore_source.py "0.1.${{ github.run_number }}" "$URL" "$SIZE" /tmp/source.json "${{ github.sha }}"
          git config user.name "opentify-ci"
          git config user.email "opentify-ci@users.noreply.github.com"
          git fetch origin altstore || true
          if git rev-parse --verify origin/altstore >/dev/null 2>&1; then
            git checkout -f -B altstore origin/altstore
          else
            git checkout --orphan altstore
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp /tmp/source.json source.json
          git add source.json
          git commit -m "Opentify 0.1.${{ github.run_number }}" || echo "beze změny"
          git push origin altstore
