services:
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks: [default, edge]
    ports:
      # Jen na tomhle PC: zvenku se k API jde výhradně přes `tailscale serve`
      # (ten přidává hlavičky Tailscale-User-*, podle kterých se určuje
      # profil -- z domácí sítě by je šlo podvrhnout).
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/db/vault.db
      MEDIA_ROOT: /data/media
      REDIS_URL: redis://redis:6379/0
      # Šifrovací klíč pro tokeny služeb v DB (ListenBrainz, Last.fm) -- jen v .env.
      OPENTIFY_DATA_KEY: ${OPENTIFY_DATA_KEY:-}
      # Přihlášení jménem a heslem (app/auth.py); `open` = bez přihlašování.
      AUTH_MODE: ${AUTH_MODE:-login}
      # Upozornění správci na telefon (ntfy, app/notify.py); prázdné = vypnuto.
      NTFY_URL: ${NTFY_URL:-}
      # Veřejná adresa (Funnel) pro tlačítka Povolit/Zamítnout v upozornění.
      OPENTIFY_PUBLIC_URL: ${OPENTIFY_PUBLIC_URL:-}
      # Knihovna › Server: přehled sdílení na Soulseeku (jen čtení, viz
      # GET /library/soulseek) -- stejný klíč jako worker.
      SLSKD_URL: http://gluetun:5030
      SLSKD_API_KEY: "${SLSKD_API_KEY_SECRET:?vygeneruj: openssl rand -base64 32}"
      MUSICBRAINZ_BASE_URL: https://musicbrainz.org/ws/2
      MUSICBRAINZ_USER_AGENT: ${MUSICBRAINZ_USER_AGENT:?nastav v .env dle MusicBrainz API etiquette, např. "VaultPersonal/0.1 (tvuj@email)"}
      # Wikidata/Wikipedia (artist bio) mají stejnou User-Agent politiku --
      # stejná hodnota jako MusicBrainz výš stačí, samostatná `.env` proměnná
      # navíc by byla jen duplicitní nastavení stejné věci.
      WIKIMEDIA_USER_AGENT: ${MUSICBRAINZ_USER_AGENT}
      # AcoustID (ověření stažených souborů otiskem, app/library/verify_file.py)
      # -- bez klíče se ověření tiše vypne.
      ACOUSTID_API_KEY: ${ACOUSTID_API_KEY:-}
      # SQLite busy_timeout pro požadavky API: radši rychle selhat (GET to
      # ustojí) než držet požadavek 15 s, když zápis drží worker/nástroj.
      DB_BUSY_TIMEOUT_MS: ${DB_BUSY_TIMEOUT_MS:-5000}
      # fanart.tv (volitelné, zdarma) -- široké fotky interpretů do hlavičky.
      FANART_API_KEY: ${FANART_API_KEY:-}
      DEEZER_API_BASE: https://api.deezer.com
      # Open Shazam (app/recognize.py) -- dotazy na Shazam VÝHRADNĚ přes
      # Mullvad (gluetun proxy, kill switch). Prázdná hodnota rozpoznávání vypne.
      SHAZAM_PROXY: ${SHAZAM_PROXY:-http://gluetun:8888}
      # Web smí API volat jen z vlastních adres (oba Tailscale uzly + lokálně).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5000,http://localhost:5000}
      # Výchozí `http://listenbrainz:8080` čeká na vlastní self-hostnutou
      # instanci (viz zakomentovaná `listenbrainz:` služba níž) -- pro reálný
      # účet na veřejném listenbrainz.org přepiš v `.env` na
      # `LISTENBRAINZ_BASE_URL=https://api.listenbrainz.org`.
      LISTENBRAINZ_BASE_URL: ${LISTENBRAINZ_BASE_URL:-http://listenbrainz:8080}
      LISTENBRAINZ_USERNAME: ${LISTENBRAINZ_USERNAME:-demo-user}
      # Uživatelský token (listenbrainz.org -> Settings) pro odesílání poslechů.
      LISTENBRAINZ_TOKEN: ${LISTENBRAINZ_TOKEN:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      # Model vkusu: v2 = celá historie ve třech profilech (app/home/activation.py),
      # v1 = posledních 365 dní. Vrácení jedním řádkem v .env.
      TASTE_MODEL: ${TASTE_MODEL:-v1}
      LASTFM_API_SECRET: ${LASTFM_API_SECRET:-}
      # Tailscale účet admina (profil podle Tailscale, viz app/auth.py).
      TAILSCALE_ADMIN_LOGIN: ${TAILSCALE_ADMIN_LOGIN:-}
      LOCAL_MUSIC_ROOT: /data/local-music
      # Podcasty jen na YouTube (app/podcasts/feeds.py) -- stejná cesta jako
      # stahování hudby z YouTube ve `worker`u.
      YTDLP_PROXY: ${YTDLP_PROXY:-}
      # Audioknihy: jen aby hledání vědělo, jestli je SkTorrent účet nastavený.
      SKTORRENT_USERNAME: ${SKTORRENT_USERNAME:-}
      SKTORRENT_PASSWORD: ${SKTORRENT_PASSWORD:-}
    volumes:
      - vault-db:/data/db
      # Stažené skladby na velkém disku (MEDIA_DIR v .env, např. E:/opentify/media),
      # ne ve virtuálním disku Dockeru na systémovém C:.
      - ${MEDIA_DIR:-./media}:/data/media
      # Vlastní hudební knihovna (externí HDD/NAS) -- `POST /library/scan` ji
      # projde a zaeviduje jako `available` bez provisioningu. `MUSIC_DIR` je
      # jediná věc, co se mění mezi prostředími (Windows vývoj vs. 24/7 Linux
      # server) -- kontejnerová cesta je vždy `/data/local-music`, kód se
      # nikdy nedotkne. Příklady do `.env`:
      #   Windows:  MUSIC_DIR=D:/Music
      #   Linux:    MUSIC_DIR=/mnt/music-hdd
      # Nenastavené `MUSIC_DIR` mountne prázdnou složku vedle repozitáře —
      # sken pak jen nic nenajde, ne chyba.
      - ${MUSIC_DIR:-./local-music}:/data/local-music:ro
      # Stejný svazek jako `worker`/`slskd` -- `GET /tracks/{id}/stream`
      # umí servírovat ještě rostoucí soubor uprostřed slskd stahování
      # (progresivní přehrávání, viz routes/provisioning.py:_tail_growing_file
      # a app/providers.py:OnFileLocated). Read-only: `api` soubory jen čte,
      # přesouvá/maže je výhradně `worker`.
      - ${SLSKD_DOWNLOADS_HOST_DIR:-./slskd-downloads}:/data/slskd-downloads:ro
      # Audioknihy stažené qBittorrentem (app/spoken) -- api je jen streamuje.
      - ${SPOKEN_DIR:-./mluvene-slovo}:/data/spoken:ro
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: ./backend
    command: python -m app.worker
    environment:
      DATABASE_URL: sqlite:////data/db/vault.db
      MEDIA_ROOT: /data/media
      REDIS_URL: redis://redis:6379/0
      # Šifrovací klíč pro tokeny služeb v DB (ListenBrainz, Last.fm) -- jen v .env.
      OPENTIFY_DATA_KEY: ${OPENTIFY_DATA_KEY:-}
      MUSICBRAINZ_BASE_URL: https://musicbrainz.org/ws/2
      # Worker taky volá MusicBrainz (párování stažených souborů) -- bez
      # kontaktu v User-Agent porušuje MB etiketu.
      MUSICBRAINZ_USER_AGENT: ${MUSICBRAINZ_USER_AGENT:?nastav v .env}
      WIKIMEDIA_USER_AGENT: ${MUSICBRAINZ_USER_AGENT}
      ACOUSTID_API_KEY: ${ACOUSTID_API_KEY:-}
      DEEZER_API_BASE: https://api.deezer.com
      # composite = zkusí slskd, při prázdném hledání/chybě padá na yt-dlp
      # (viz app/providers.py). "placeholder" pro dev bez slskd/yt-dlp.
      MEDIA_PROVIDER: ${MEDIA_PROVIDER:-composite}
      TASTE_MODEL: ${TASTE_MODEL:-v1}
      # `slskd` sdílí síťový stack s `gluetun` (viz níž) -- na Dockeru se pod
      # svým vlastním jménem už neresolvuje, port 5030 je ale dosažitelný
      # přes IP/jméno toho, kdo tu síť vlastní.
      SLSKD_URL: http://gluetun:5030
      # Do `X-API-Key` hlavičky jde JEN holý klíč, bez `role=...;cidr=...;`
      # obálky, kterou má `slskd.environment.SLSKD_API_KEY` níž -- obojí musí
      # nést stejnou hodnotu `SLSKD_API_KEY_SECRET` z .env.
      SLSKD_API_KEY: "${SLSKD_API_KEY_SECRET:?vygeneruj: openssl rand -base64 32}"
      SLSKD_DOWNLOADS_DIR: /data/slskd-downloads
      # YouTube jde standardně napřímo (tvoje volba -- jen Google vidí IP).
      # `YTDLP_PROXY=http://gluetun:8888` v .env ho pošle přes Mullvad; pak
      # se zapne i automatické přepnutí VPN
      # serveru, když YouTube konkrétní IP zablokuje (viz providers.py).
      YTDLP_PROXY: ${YTDLP_PROXY:-}
      GLUETUN_CONTROL_URL: http://gluetun:8000
      GLUETUN_CONTROL_API_KEY: "${GLUETUN_CONTROL_API_KEY:?chybí v .env}"
      # Kontrola podezřelých stažení Shazamem (app/library/download_check.py)
      # -- stejně jako u api VÝHRADNĚ přes Mullvad.
      SHAZAM_PROXY: ${SHAZAM_PROXY:-http://gluetun:8888}
      # Audioknihy: SkTorrent (stažení .torrent chce účet; hledání ne) a
      # qBittorrent za VPN (app/spoken). Bez účtu kniha čeká ve frontě.
      SKTORRENT_USERNAME: ${SKTORRENT_USERNAME:-}
      SKTORRENT_PASSWORD: ${SKTORRENT_PASSWORD:-}
      QBIT_URL: http://gluetun:8080
    volumes:
      - vault-db:/data/db
      - ${MEDIA_DIR:-./media}:/data/media
      # Sdílený se `slskd` službou -- worker po dokončení transferu soubor
      # přesune odsud do `media-library` (viz SlskdProvider.fetch).
      - ${SLSKD_DOWNLOADS_HOST_DIR:-./slskd-downloads}:/data/slskd-downloads
      # Stejná cesta jako v `qbittorrent` (import čte, co torrent stáhl).
      - ${SPOKEN_DIR:-./mluvene-slovo}:/data/spoken
    depends_on:
      - redis
      - slskd
      - gluetun
    restart: unless-stopped
    # 3 souběžné kopie ve výchozím stavu -- jeden pomalý/opakovaně selhávající
    # job (viz živý test: ABBA 3 pokusy zablokovaly frontu ~10 minut) jinak
    # zdrží úplně všechny ostatní stahování za sebou, protože Redis Stream
    # zprávy jeden worker zpracovává striktně sekvenčně. `worker.py` je na
    # víc replik připravený (unikátní `CONSUMER_NAME` per proces/hostname).
    # Nastav v `.env` `WORKER_REPLICAS=1`, když chceš zpátky jeden proces.
    deploy:
      replicas: ${WORKER_REPLICAS:-3}

  # Mullvad VPN klient (WireGuard) -- `slskd` níž mu VÝHRADNĚ sdílí síťový
  # stack (`network_mode: service:gluetun`), takže veškerý Soulseek provoz
  # (a jeho sdílená knihovna) jde jen přes tenhle tunel, nikdy přímo z tvojí
  # skutečné IP. Gluetun má vestavěný "kill switch" -- pokud VPN tunel
  # spadne, gluetunův firewall zablokuje VEŠKEROU síť (i pro slskd, protože
  # ji sdílí), místo aby provoz potichu propustil napřímo. Ověřeno proti
  # https://github.com/qdm12/gluetun-wiki (setup/providers/mullvad.md,
  # setup/options/firewall.md) -- ne nahádáno.
  #
  # Nastav v `.env`:
  #   MULLVAD_WIREGUARD_PRIVATE_KEY  -- z Mullvad účtu: vygeneruj WireGuard
  #                                     konfiguraci, v staženém JSON pole "PrivateKey".
  #   MULLVAD_WIREGUARD_ADDRESSES    -- ze stejného JSON pole "Address" (jen IPv4 část).
  # Obojí je stejné napříč všemi Mullvad servery, není potřeba měnit při
  # přepnutí `SERVER_CITIES`.
  gluetun:
    image: qmcgaw/gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: mullvad
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${MULLVAD_WIREGUARD_PRIVATE_KEY:?vygeneruj WireGuard konfiguraci v Mullvad účtu, viz komentář výš}
      WIREGUARD_ADDRESSES: ${MULLVAD_WIREGUARD_ADDRESSES:?ze stejné WireGuard konfigurace, pole "Address"}
      SERVER_CITIES: ${MULLVAD_SERVER_CITIES:-Prague}
      # Bez tohohle by gluetunův firewall blokoval i lokální docker síť
      # (`worker`/`api` -> `gluetun:5030`, ve skutečnosti slskd) -- MUSÍ
      # sedět s podsítí v `networks.default.ipam` na konci souboru a NESMÍ
      # se překrývat s rozsahem VPN tunelu (gluetun to sám hlídá/odmítne).
      FIREWALL_OUTBOUND_SUBNETS: 172.28.0.0/16
      # HTTP proxy pro yt-dlp ve `worker`u -- YouTube stahování tak jde přes
      # stejný tunel jako slskd, ne z tvojí skutečné IP. Port 8888 NENÍ
      # publikovaný na hostitele (viz `ports:` níž), dosažitelný jen z Docker
      # sítě. Spadne-li tunel, proxy nemá kudy ven -> stahování selže, ne leak.
      HTTPPROXY: "on"
      HTTPPROXY_LISTENING_ADDRESS: ":8888"
      # Control API (port 8000, jen uvnitř Docker sítě) chráněné API klíčem --
      # worker ho volá jen pro přepnutí serveru (PUT /v1/vpn/status).
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: '{"auth":"apikey","apikey":"${GLUETUN_CONTROL_API_KEY:?chybí v .env}"}'
    ports:
      # Přesunuto sem ze `slskd` -- container se svým vlastním
      # `network_mode: service:X` nesmí mít vlastní `ports:`, publikuje se
      # na tom, kdo síť vlastní. Jen pro lokální debugging přes web UI,
      # nikdy nevystavuj veřejně.
      # Jen tenhle počítač -- ne domácí Wi-Fi ani pracovní Radmin VPN
      # (bezpečnostní audit: UI slskd bylo vidět v celé síti).
      - "127.0.0.1:5030:5030"
    restart: unless-stopped

  # Soulseek daemon (https://github.com/slskd/slskd) -- primární zdroj pro
  # SlskdProvider. Vyžaduje vlastní Soulseek účet (zdarma, přihlašovací jméno
  # a heslo si vymyslíš při prvním připojení, žádná registrace předem, viz
  # https://www.slsknet.org). Env proměnné/porty ověř proti verzi, kterou
  # nasazuješ -- tohle je jen výchozí sketch, ne garantované rozhraní napříč
  # verzemi (viz docs/config.md v repu slskd/slskd).
  #
  # SLSKD_API_KEY tady NENÍ totéž, co worker posílá v `X-API-Key` hlavičce --
  # tenhle env var čeká `role=...;cidr=...;<klíč>` obálku (klíč sám musí mít
  # 16-255 znaků); worker (viz výše) posílá jen samotný `<klíč>`.
  slskd:
    image: slskd/slskd:latest
    # VEŠKERÝ síťový provoz (Soulseek protokol i REST API na 5030) jde přes
    # `gluetun`, ne přímo -- proto žádné vlastní `ports:`/`networks:` tady
    # dole, ty jsou zakázané spolu s `network_mode: service:X`.
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      SLSKD_SLSK_USERNAME: ${SLSKD_SLSK_USERNAME:?Soulseek účet -- nastav v .env}
      SLSKD_SLSK_PASSWORD: ${SLSKD_SLSK_PASSWORD:?Soulseek heslo -- nastav v .env}
      SLSKD_API_KEY: "role=ReadWrite;cidr=0.0.0.0/0,::/0;${SLSKD_API_KEY_SECRET:?vygeneruj: openssl rand -base64 32}"
      # Přihlášení do webového UI slskd (http://127.0.0.1:5030) -- jinak
      # výchozí slskd/slskd (bezpečnostní audit V1). Appka jde přes API klíč.
      SLSKD_USERNAME: ${SLSKD_WEB_USERNAME:-slskd}
      SLSKD_PASSWORD: ${SLSKD_WEB_PASSWORD:-slskd}
      # BEZ TOHOHLE nás Soulseek síť bere jako "leechera" -- řada peerů
      # stahování rovnou odmítne ("Transfer rejected: File not shared."),
      # živě pozorováno, klidně i u populárních skladeb. Sdílí se zpátky
      # tvoje vlastní knihovna (stejný `MUSIC_DIR` jako u `api`/skenu) --
      # POZOR: to znamená, že ji ostatní uživatelé Soulseek sítě uvidí a
      # budou si z ní moct stahovat (přes VPN tunel, ne přes tvoji IP).
      # Pokud tohle nechceš, dej do `.env` `SLSKD_SHARED_DIR=` (prázdné) --
      # ale sdílení je legitimní důvod, proč stahování z jiných zdrojů
      # běžně funguje líp/rychleji.
      # + stažené ze Soulseeku s čitelnými jmény (app/library/share_view.py).
      SLSKD_SHARED_DIR: ${SLSKD_SHARED_DIR-/data/local-music;/data/sdilene}
    volumes:
      - ${SLSKD_DOWNLOADS_HOST_DIR:-./slskd-downloads}:/app/downloads
      - slskd-data:/app/data
      - ${MUSIC_DIR:-./local-music}:/data/local-music:ro
      - ${MEDIA_DIR:-./media}/sdilene:/data/sdilene:ro
    restart: unless-stopped

  # Torrenty pro audioknihy (SkTorrent, app/spoken). Stejně jako slskd sdílí
  # síť s `gluetun` -- veškerý provoz jde přes Mullvad, při výpadku tunelu
  # nikudy. Web UI / API na gluetun:8080 jen z Docker sítě (není publikované
  # na hostitele); z ní se pouští bez hesla (AuthSubnetWhitelist, nastavuje
  # `docker/qbittorrent-init.sh` při startu). Stažené knihy dál seedují.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      TZ: Europe/Prague
      WEBUI_PORT: "8080"
    volumes:
      - qbittorrent-config:/config
      - ${SPOKEN_DIR:-./mluvene-slovo}:/data/spoken
      - ./docker/qbittorrent-init.sh:/custom-cont-init.d/10-opentify-auth:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Strop paměti: cache katalogu (Deezer/MB/Wikidata, všechny s TTL) rostla
    # bez limitu na 1,4 GB. volatile-* vyhazuje jen klíče s TTL -- fronty,
    # joby a streamy (bez TTL) zůstanou vždy. LFU (ne LRU): vyhodí jednorázové
    # dotazy na alba, stránky žánrů/her/filmů (čtené často) zůstanou -- s LRU
    # se vyhazovaly a první návštěva čekala 20-30 s.
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lfu"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # Web Opentify (statický Flutter build). Jen 127.0.0.1 (tailscale serve na
  # hostu) a Docker síť (kontejner `tailscale`) -- dřív dhttpd na 0.0.0.0.
  web:
    image: nginx:1.27-alpine
    volumes:
      - ./client/build/web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:5000:80"
    networks: [edge]
    mem_limit: 64m
    restart: unless-stopped

  # Opentify jako SAMOSTATNÉ zařízení v Tailscale (`opentify.…ts.net`):
  # kamarádům se sdílí jen tohle, ne celé PC (desktop-…ts.net). Vystavuje
  # jen web + API Opentify (tailscale/serve.json). Bez TS_AUTHKEY vypíše do
  # logu přihlašovací odkaz -- otevřít, schválit, hotovo (stav ve volume).
  tailscale:
    image: tailscale/tailscale:stable
    hostname: opentify
    environment:
      TS_HOSTNAME: opentify
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_AUTHKEY: ${TS_AUTHKEY:-}
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    depends_on: [api, web]
    # Jen síť `edge` (web + api) -- uzel pro kamarády nevidí Redis, gluetun
    # ani worker (dřív sdílel síť `default` se vším).
    networks: [edge]
    mem_limit: 128m
    restart: unless-stopped

  # Volitelné, mimo scope tohoto sketche — vlastní ListenBrainz instance
  # pro doporučení. Dokud neběží, /recommendations/* endpointy vrací
  # prázdný výsledek nebo 503.
  # listenbrainz:
  #   image: metabrainz/listenbrainz:latest
  #   ...

  # Reverse proxy pro TLS by měl sedět před `api`, ale doporučeně jen
  # přes VPN/Tailscale, nikdy jako veřejně vystavený port.
  # reverse-proxy:
  #   image: caddy:2-alpine
  #   ports: ["443:443"]
  #   depends_on: [api]

volumes:
  vault-db:
  redis-data:
  slskd-data:
  qbittorrent-config:
  tailscale-state:

networks:
  # Pevná podsíť (místo Dockerem náhodně přiděleného rozsahu) -- `gluetun`
  # potřebuje přesně tenhle rozsah v `FIREWALL_OUTBOUND_SUBNETS`, ať pustí
  # lokální provoz z `worker`/`api` (na `gluetun:5030` = slskd) ven ze svého
  # firewallu, ale nedeterministický Dockerem-přidělený rozsah by se časem
  # mohl změnit a potichu to rozbít.
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
  # Okraj: Tailscale uzel `opentify` + web + api.
  edge:
